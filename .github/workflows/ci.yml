name: CI for BLAS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run interface tests
      run: |
        pytest tests/test_blas.py -v -k "test_saxpy or test_ddot or test_dgemm"

    - name: Run performance test
      run: |
        pytest tests/test_blas.py -v -k "test_benchmark"